services:
  falkordb:
    image: falkordb/falkordb:latest
    ports: ["6379:6379", "3000:3000"]  # 3000 = FalkorDB Browser
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30
  app:
    build: .
    ports: ["8000:8000"]
    environment:
      FALKORDB_HOST: falkordb
      LLM_API_KEY: ${LLM_API_KEY:-}
      # inside Docker, a host Ollama is http://host.docker.internal:11434/v1 (not localhost)
      LLM_BASE_URL: ${DOCKER_LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      LLM_MODEL: ${DOCKER_LLM_MODEL:-gemma-4-26b-a4b-it}
      LLM_DISABLED: ${LLM_DISABLED:-false}
    depends_on:
      falkordb:
        condition: service_healthy
